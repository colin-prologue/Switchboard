# Switchboard status-transition table — single source of truth (issue #29, part A).
#
# GitHub has no native workflow-rule engine, so the lifecycle rules that the
# status:* labels imply are declared here, in ONE committed file, and consumed
# by whichever component can observe what a given section describes:
#
#   - `edges`            — full (from -> to) rule set, incl. actor and phase
#                          annotations. Consumed by `status_board.py` (issue #22),
#                          which derives the honored-drag set and its marker side
#                          effects from these rows; a board drag supplies BOTH
#                          endpoints, which is what makes them readable there.
#                          The SCHEDULER still cannot read this section: it polls
#                          *current* state and has no `from` (cross-restart edge
#                          reconstruction is the durability trap AgDR-008
#                          escaped).
#
#                          Originally written for #52's `labeled`-event Action.
#                          That scope was withdrawn on 2026-08-15 — per-project
#                          stances (AgDR-039) mean there is no longer one legal
#                          state machine for a shared table to describe, and #52
#                          was renarrowed to stance-independent checks only.
#                          KNOWN GAP: `status_board.load_active_states` reads
#                          `WORKFLOW.base.md` unconditionally, so the honored-drag
#                          set is derived from base's states whatever project's
#                          board is being synced.
#   - `requires_marker`  — per-state provenance markers the dispatch guard demands
#                          before it will claim an issue in that state. This is the
#                          ONLY section the orchestrator reads (it can observe the
#                          current state + labels — no `from` needed). See AgDR-011.
#
# Ratified 2026-07-05, amended 2026-07-07. See methodology/METHODOLOGY.md for the
# gate semantics and self/.decisions/AgDR-011-* for the dispatch-guard exception.
#
# Actor note: every actor is `colin-prologue` today; actor-conditional
# enforcement needs #10 (provenance). v1 records the actor for documentation and
# for #52, but nothing enforces it yet.

edges:
  # --- Gate A: intent/spec authoring -----------------------------------------
  - from: drafting
    to: triage
    actor: human
  # The operator-approved fold (#51 detect / #126 apply). Same edge, different
  # actor: apply rewrites the body from the verdict's proposal block, posts the
  # durable `switchboard:fold-applied` marker comment, then relabels. The
  # relabel is the TERMINAL act — it evicts the issue from the fold poll set
  # (scheduler.FOLD_POLL_STATES), so every failable step precedes it.
  - from: drafting
    to: triage
    actor: fold
    note: "operator /fold or 👍 approved; apply folded the proposal into the body"

  # --- Triage: adversarial ticket verification (active state, AgDR-006) ------
  # PASS stamps the durable provenance marker in the SAME gh edit as the state
  # relabel (workflow/WORKFLOW.base.md). The marker is what the dispatch guard
  # keys on; see requires_marker below.
  - from: triage
    to: todo
    actor: triage-verifier
    verdict: PASS
    add_marker: gate:triage-passed
  - from: triage
    to: drafting
    actor: triage-verifier
    verdict: needs-work
    remove_marker: gate:triage-passed   # cleared on every route back to drafting
  - from: triage
    to: drafting
    actor: triage-verifier
    verdict: SPLIT
    note: "children filed @drafting (native blocked-by), parent parked @drafting"
  - from: triage
    to: decision
    actor: triage-verifier
    verdict: needs-decision

  # --- decision: waiting on the operator to answer a Gate-A question (#55) ----
  # A gate BY OMISSION from active_states — no orchestrator code or config reads
  # `decision`; the allowlist semantics of active_states park it for free, the
  # same way drafting/plan-review/human-review are gated.
  #
  # `decision -> triage` is deliberately ILLEGAL: the chosen option must be
  # folded into the issue body first, and the fold path is the existing
  # `drafting -> triage` edge above. Re-entering triage with the answer living
  # only in a comment would re-triage the same unchanged body — the loop #55
  # exists to stop.
  - from: decision
    to: drafting
    actor: human
    verdict: answered
    remove_marker: gate:triage-passed
    note: "operator chose an option; body fold pending (#51 — manual today)"

  # --- todo: dispatchable ----------------------------------------------------
  - from: todo
    to: in-progress
    actor: orchestrator
    note: "orchestrator claim (AgDR-010, in-progress-claim-visibility)"
  - from: todo
    to: fail-review
    actor: orchestrator
    trigger: cap-hit
    note: >-
      the DOMINANT cap-hit entry, not an edge case: the cap check runs before
      the in-progress claim write, and the claim label is reverted to
      status:todo between sessions, so the dispatch attempt that trips the cap
      almost always sees status:todo (issue #31)
  - from: todo
    to: parked
    actor: orchestrator
    trigger: cap-hit
    note: >-
      cap-hit park from todo, TWO producers (issue #31): (1) the
      unprovisioned-status:fail-review fallback — a project registered before
      #31 shipped has no such label, so the relabel raises
      github_label_not_found and the cap branch falls back to _park(); (2) the
      episode cap — a later implement cap-hit with gate:fail-reviewed already
      present parks instead of opening a second fail-review episode
  - from: todo
    to: plan-review
    actor: human
    note: "Symphony Gate B (architecture-touching work)"
  - from: todo
    to: human-review
    actor: orchestrator
    degraded: true
    note: >-
      degraded path only: the claim-label write (todo -> in-progress) failed,
      which is non-fatal by design, so a completing worker hands off straight to
      human-review without the in-progress hop. Not a normal edge — kept so #52
      does not flag the handoff as illegal.

  # --- Gate B: plan/architecture review --------------------------------------
  - from: plan-review
    to: in-progress
    actor: human
    verdict: approved
  - from: plan-review
    to: drafting
    actor: human
    verdict: rejected

  # --- in-progress: an agent is working it -----------------------------------
  - from: in-progress
    to: human-review
    actor: orchestrator
    note: "orchestrator-owned terminal handoff after provider success +
      validated .run/handoff-evidence.json (issue #61 / AgDR-028); workers
      write evidence, never status labels"
  - from: in-progress
    to: todo
    actor: orchestrator
    note: "claim release / startup stranded-claim sweep"
  - from: in-progress
    to: parked
    actor: orchestrator
    trigger: cap-hit
    note: >-
      cap-hit park from in-progress (AgDR-002/008). KEPT, not retired by #31,
      and with TWO producers: (1) the unprovisioned-status:fail-review fallback
      — an always-on path for every project registered before #31, whose
      relabel raises github_label_not_found and falls back to _park(); (2) the
      episode cap — a later implement cap-hit with gate:fail-reviewed present
      parks instead of relabelling

  # --- triage: the verify-role cap-out ---------------------------------------
  # #31 changed the routing for IMPLEMENT-role cap-hits only. A triage cap-out
  # still parks: relabelling it to fail-review would raise handoff_preempted
  # (status:triage is in neither entry of set_sole_status_label's default
  # expected_status), so the cap branch gates the relabel on the implement role.
  - from: triage
    to: parked
    actor: orchestrator
    trigger: cap-hit
    note: "verify budget exhausted -> durable park; unchanged by #31"

  # --- parked: cap-halt awaiting human ---------------------------------------
  - from: parked
    to: drafting
    actor: human
    verdict: revise
    remove_marker: gate:triage-passed   # re-scope re-enters triage, so clear it
  - from: parked
    to: todo
    actor: human
    note: "human accepts with a verdict in hand (no re-triage; marker survives)"
  - from: parked
    to: triage
    actor: human
    note: >-
      unpark of a verify-role cap-out. _park retains status:triage through the
      park (it sorts after status:parked, so derivation stays `parked`), which
      means removing status:parked derives `triage` and the issue resumes
      verification; marker untouched (issue #31)

  # --- Gate C: final review --------------------------------------------------
  - from: human-review
    to: closed
    actor: human
    verdict: merged
  - from: human-review
    to: todo
    actor: [human, orchestrator]
    verdict: changes-requested
    trigger: review-response
    note: >-
      re-enters dispatch WITHOUT re-triage; marker deliberately survives.
      TWO actors, ONE edge (issue #43 / AgDR-037): the human path is the
      changes-requested verdict; the orchestrator path is the review-response
      sub-poll, which takes this edge when a bound PR carries a bot review
      thread that is unresolved and whose last bot comment postdates
      Switchboard's last reply. The re-dispatched session is an ordinary
      implement-role session — no new state, no new role. Bounded by a durable
      per-PR round marker (2 rounds); at the cap the orchestrator stops
      relabeling and comments instead of parking.

  # === fail-review: post-failure diagnosis (ACTIVE since #31) =================
  # Pre-encoded by #29 as `active: false` / `requires: "#20b"`; #31 shipped the
  # verifier, so these are live. The `actor:` annotations were also corrected:
  # #29 guessed `human` on all three routes out, but the ratified routing model
  # is an AUTO-route written by the verifier SESSION. The taxonomy behind the
  # classes is an importable contract (failure_taxonomy.py, issue #169 from #16).
  #
  # The routes OUT are `gh issue edit` calls made by the verifier session, not
  # tracker-layer writes — exactly how triage routes today, and therefore with
  # no preemption guard and no expected_status.
  - from: in-progress
    to: fail-review
    actor: orchestrator
    trigger: cap-hit
    note: >-
      implement-role cap-hit routes to a fail-review diagnosis instead of
      parking. Reached when the cap trips on an issue still carrying the claim
      label; the todo -> fail-review edge above is the commoner path
  - from: fail-review
    to: todo
    actor: fail-review-verifier
    verdict: retry
    note: >-
      retry-class verdict (blockage:permission, blockage:dependency, quota):
      the wall was external and the approach held, so the verdict comment is
      the full brief. BOTH markers deliberately survive — same body, same
      diagnosis, so the episode bound still holds
  - from: fail-review
    to: drafting
    actor: fail-review-verifier
    verdict: re-scope
    remove_marker: gate:triage-passed   # re-scope re-enters triage, so clear it
    note: >-
      `iteration` (facts-only brief, prior conclusions excluded) and
      `complexity` (verdict recommends a SPLIT with drafted child bodies; the
      human files them — no autonomous split). Byte-identical flags for both.
      gate:fail-reviewed is cleared too: a materially different body has earned
      a fresh diagnosis, and clearing the triage marker is what keeps re-entry
      gated on a human re-draft PLUS a triage PASS
  - from: fail-review
    to: parked
    actor: [fail-review-verifier, orchestrator]
    verdict: hold
    trigger: cap-hit
    note: >-
      FOUR producers, ONE edge (on the human-review -> todo precedent). The
      verifier path is the `hold` verdict — no automated recovery is correct —
      written as `--add-label status:parked,status:todo` so the hold-parked
      label set matches _park's invariant and the operator's unpark derives an
      active state. The three orchestrator paths all run through _park(): the
      fail-review session itself exhausting its budget (the cap branch
      discriminates on nothing but the spent counter), a gate:fail-reviewed
      marker write that fails after the status write already landed, and a
      handoff_label_rollback_failed leaving a dual-status state

# --- requires_marker: the ONLY section the orchestrator dispatch guard reads ---
# Per-state provenance markers that must be present on an issue before the guard
# will claim it in that state. Keyed by current state (normalized, spaces not
# dashes — matches tracker.py state derivation). See AgDR-011 for why this narrow
# config-driven check is a bounded exception to AgDR-006.
requires_marker:
  todo:
    - gate:triage-passed   # a todo is only dispatchable if triage promoted it
